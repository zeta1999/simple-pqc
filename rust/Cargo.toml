[package]
name = "simple-pqc-demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "simple_pqc_demo"
path = "src/lib.rs"

[[bin]]
name = "pqc-server"
path = "src/bin/server.rs"

[[bin]]
name = "pqc-client"
path = "src/bin/client.rs"

[dependencies]
# rustls with aws-lc-rs provider + prefer-post-quantum (default features).
# NB: the `ring` provider has NO post-quantum support -- aws-lc-rs is required.
rustls = { version = "0.23", default-features = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
anyhow = "1"
